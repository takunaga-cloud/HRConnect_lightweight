version: 1
frontend:
  phases:
    preBuild:
      commands:
        - cd frontend
        - pnpm install
    build:
      commands:
        - env | grep -e NEXT_PUBLIC_ >> .env.production
        - pnpm build
  artifacts:
    baseDirectory: frontend/.next
    files:
      - '**/*'
  cache:
    paths:
      - frontend/.pnpm-store/**/*
      - frontend/node_modules/**/*

