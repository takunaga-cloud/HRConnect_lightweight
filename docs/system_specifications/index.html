: "運用スクリプト & 結合・単体テスト", "lines": 75, "summary": "test_project_service.py モジュール / 設定ファイル", "details": {"classes": [], "functions": [{"name": "test_create_and_get_project", "args": ["db_session"], "doc": ""}, {"name": "test_update_project", "args": ["db_session"], "doc": ""}, {"name": "test_delete_project", "args": ["db_session"], "doc": ""}], "imports": ["app.models", "app.schemas.project", "app.services.project_service", "datetime", "pytest", "pytest_asyncio", "sqlalchemy.ext.asyncio", "uuid"]}, "preview": "import pytest\nimport pytest_asyncio\nfrom uuid import uuid4\nfrom datetime import date\nfrom sqlalchemy.ext.asyncio import AsyncSession\n\nfrom app.services.project_service import ProjectService\nfrom app.schemas.project import ProjectCreate, ProjectUpdate\nfrom app.models import User, Department, WorkRule\n\n@pytest.mark.asyncio\nasync def test_create_and_get_project(db_session: AsyncSession):\n    service = ProjectService(db_session)\n    \n    # Create"}, {"rel_path": "backend/tests/test_workflow_side_effects.py", "filename": "test_workflow_side_effects.py", "category_id": "7_scripts_tests", "category_name": "運用スクリプト & 結合・単体テスト", "lines": 85, "summary": "test_workflow_side_effects.py モジュール / 設定ファイル", "details": {"classes": [], "functions": [{"name": "test_apply_paid_leave_side_effects_creates_shift", "args": [], "doc": ""}], "imports": ["app.models", "app.schemas.application", "app.services.side_effect", "datetime", "pytest", "unittest.mock", "uuid"]}, "preview": "\nimport pytest\nfrom unittest.mock import AsyncMock, MagicMock\nfrom uuid import uuid4\nfrom datetime import date, timedelta\n\nfrom app.models import Application, PaidLeaveLedger, Shift\nfrom app.schemas.application import PaidLeaveInputData\nfrom app.services.side_effect import SideEffectService\n\n@pytest.mark.asyncio\nasync def test_apply_paid_leave_side_effects_creates_shift():\n    # Arrange\n    db = AsyncMock()\n    user_id = uuid4()"}, {"rel_path": "deploy.sh", "filename": "deploy.sh", "category_id": "1_infra_aws", "category_name": "インフラ & AWSサーバーレス構成", "lines": 59, "summary": "!/bin/bash", "details": {}, "preview": "#!/bin/bash\n\nset -e\n\n# AWS CLIとCDK CLIがインストールされていることを確認\nif ! command -v aws &> /dev/null\nthen\n    echo \"AWS CLI がインストールされていません。インストールしてください。\"\n    exit 1\nfi\n\nif ! command -v cdk &> /dev/null\nthen\n    echo \"AWS CDK CLI がインストールされていません。インストールしてください。\"\n    exit 1"}, {"rel_path": "design.md", "filename": "design.md", "category_id": "8_docs_and_others", "category_name": "ドキュメント & プロジェクト共通設定", "lines": 500, "summary": "design.md", "details": {}, "preview": "# design.md\n\n---\n\n## 1. プロジェクト概要 (Overview)\n\n### 1.1 プロジェクト名\n    **HR-Connect (仮)**\n\n### 1.2 目的・解決したい課題\n*   **オールインワン労務管理:** 既存ツール（ジョブカン等）が持つ「勤怠管理」「シフト管理」「ワークフロー（諸届申請）」に加え、「工数管理（日報）」を単一のプラットフォームで統合管理する。\n*   **プロジェクト収支の可視化:** 従業員が「どのプロジェクトの・どの作業に・何時間使ったか」を記録し、案件ごとの人件費コストを正確に算出可能にする。\n*   **申請と勤怠の自動連動:** 休暇申請や残業申請が承認された際、自動的に勤怠データや有給残日数へ反映させ、手作業による転記ミスをゼロにする。\n*   **複雑な就業ルールの吸収:** フレックス、変形労働制、36協定（残業上限）チェックなど、日本の複雑な労務管理に対応する。これらルールは`work_rules.config`のJSONBスキーマ定義に基づき、柔軟に設定・管理される。\n*   **セキュアな基盤:** Amazon Cognitoを用いた堅牢な認証と、AWSサーバーレス構成によるスケーラビリティを確保する。"}, {"rel_path": "distribution_guide.md", "filename": "distribution_guide.md", "category_id": "8_docs_and_others", "category_name": "ドキュメント & プロジェクト共通設定", "lines": 138, "summary": "Windows向けアプリケーション配布・起動手順書", "details": {}, "preview": "# Windows向けアプリケーション配布・起動手順書\n\n本システム（HRConnect）を、何も開発環境が導入されていないWindowsパソコンで動かすための、準備から起動までの手順書です。この内容をそのまま配布先の方へお渡しいただけます。\n\n---\n\n## 1. 配布先（Windows）での準備（事前セットアップ）\n\nDocker環境をWindowsで動かすために、以下の手順で環境を構築します。\n\n### ステップA: WSL2（Windows Subsystem for Linux）のインストール\nDockerをWindows上で高速に動作させるため、Windows標準のLinux実行環境（WSL2）を有効化します。\n\n1. **PowerShell** を「管理者として実行」で開きます。\n2. 以下のコマンドを入力して実行します："}, {"rel_path": "docker-compose.prod.yml", "filename": "docker-compose.prod.yml", "category_id": "1_infra_aws", "category_name": "インフラ & AWSサーバーレス構成", "lines": 41, "summary": "NOTE: 本番稼働は EC2/常時稼働コンテナではなく、AWS Lambda + DynamoDB + S3 + Cognito の", "details": {}, "preview": "# NOTE: 本番稼働は EC2/常時稼働コンテナではなく、AWS Lambda + DynamoDB + S3 + Cognito の\n# 完全サーバーレス構成（アイドル時固定費 $0）が推奨されます。\n# デプロイには `./deploy.sh` (AWS CDK) または AWS SAM / AWS Amplify を使用してください。\n# 本ファイルは、コンテナ環境でのステージング・動作確認用として保持しています。\n\nservices:\n  backend:\n    build:\n      context: ./backend\n      dockerfile: Dockerfile\n    restart: always\n    environment:\n      - DYNAMODB_TABLE_NAME=${DYNAMODB_TABLE_NAME:-HRConnectTable-prod}\n      - AWS_REGION=${AWS_REGION:-ap-northeast-1}\n      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}"}, {"rel_path": "docker-compose.yml", "filename": "docker-compose.yml", "category_id": "8_docs_and_others", "category_name": "ドキュメント & プロジェクト共通設定", "lines": 28, "summary": "docker-compose.yml モジュール / 設定ファイル", "details": {}, "preview": "version: '3.8'\n\nservices:\n  backend:\n    build: \n      context: ./backend\n    ports:\n      - \"8000:8000\"\n    volumes:\n      - ./backend:/app\n      - /app/venv # Prevent venv overlay\n    environment:\n      - DATABASE_URL=sqlite+aiosqlite:////app/hr_connect.db\n      - ALLOW_MOCK_AUTH=true\n      - SUPABASE_JWT_SECRET=local-dev-jwt-secret-key-32-chars-long"}, {"rel_path": "docs/basic_design.md", "filename": "basic_design.md", "category_id": "8_docs_and_others", "category_name": "ドキュメント & プロジェクト共通設定", "lines": 106, "summary": "HRConnect 基本設計書", "details": {}, "preview": "# HRConnect 基本設計書\n\n## 1. システムアーキテクチャ (System Architecture)\n\n本システムは、モダンなSPA (Single Page Application) フロントエンドと、軽量かつ高速なバックエンドAPIで構成されたモノレポ（Monorepo）構造を採用し、AWSのサーバーレスアーキテクチャ上で稼働します。\n\n```mermaid\ngraph TD\n    User((ユーザー/管理者))\n    \n    subgraph \"Frontend (Next.js)\"\n        NextJS[Next.js App Router]\n        Geo[Geolocation API]\n    end\n"}, {"rel_path": "docs/database_design.md", "filename": "database_design.md", "category_id": "8_docs_and_others", "category_name": "ドキュメント & プロジェクト共通設定", "lines": 291, "summary": "HRConnect DB設計書", "details": {}, "preview": "# HRConnect DB設計書\n\n## 1. ER図 (Entity Relationship Diagram)\n\n本システムは、複雑な集計クエリ（勤怠・シフト・工数の突合）を高速化するリレーショナル設計と、柔軟なルール設定や動的申請フォームを可能にする JSONB 型をハイブリッドで採用しています。\n\n```mermaid\nerDiagram\n    users ||--o{ shifts : \"assigned\"\n    users ||--o{ attendances : \"records\"\n    users ||--o{ work_logs : \"inputs\"\n    users ||--o{ applications : \"requests\"\n    users ||--o{ paid_leave_ledgers : \"owns\"\n\n    work_rules ||--|{ users : \"applies\""}, {"rel_path": "docs/development_guide.md", "filename": "development_guide.md", "category_id": "8_docs_and_others", "category_name": "ドキュメント & プロジェクト共通設定", "lines": 179, "summary": "HRConnect 改修指南書 (開発者向けガイド)", "details": {}, "preview": "# HRConnect 改修指南書 (開発者向けガイド)\n\n## 1. ディレクトリ構造の解説 (Monorepo Structure)\n\n本プロジェクトはフロントエンドとバックエンドが単一のリポジトリで管理されるモノレポ構成を採用しています。\n\n```text\n/\n├── frontend/          # Next.js (TypeScript) - クライアントアプリ\n│   ├── src/app/       # App Router構成\n│   │   ├── (auth)/    # 認証関連（ログイン、パスワードリセット）\n│   │   ├── (user)/    # 一般従業員用（打刻、工数、申請）\n│   │   └── (admin)/   # 管理者・労務用（シフト、承認、アナリティクス）\n│   └── src/lib/       # 共有ライブラリ（APIクライアント、Cognito連携）\n│"}, {"rel_path": "docs/functional_design.md", "filename": "functional_design.md", "category_id": "8_docs_and_others", "category_name": "ドキュメント & プロジェクト共通設定", "lines": 160, "summary": "HRConnect 機能設計書", "details": {}, "preview": "# HRConnect 機能設計書\n\n## 1. 主要ユースケース (Use Cases)\n\n本システムは、従業員の自律的な打刻・工数入力と、管理者の迅速なシフト・承認管理を支援するための4つの主要ユースケースを軸に設計されています。\n\n---\n\n## 2. 詳細業務フローとシーケンス\n\n### 2.1 打刻と予実判定フロー (Stamping & Verification)\nユーザーがスマートフォンやPCから打刻した際、システムはバックエンドで即座にその日のシフト予定と適用就業規則を突合し、遅刻判定および出退勤時間の丸め計算を実行します。\n公休または全日休暇の対象日は打刻不可となります。\n\n```mermaid"}, {"rel_path": "docs/maintenance_manual.md", "filename": "maintenance_manual.md", "category_id": "8_docs_and_others", "category_name": "ドキュメント & プロジェクト共通設定", "lines": 102, "summary": "HRConnect メンテナンス手順書", "details": {}, "preview": "# HRConnect メンテナンス手順書\n\n## 1. 開発環境の構築手順 (Development Setup)\n\n本システムは、ローカル環境で Docker および Docker Compose を用いて迅速に起動できます。本番環境は AWS DynamoDB / Cognito を使用しますが、ローカル環境では SQLite（データ投入用）および DynamoDB Local または認証モック（`ALLOW_MOCK_AUTH=true`）を使用して動作させます。\n\n### 1.1 前提条件 (Prerequisites)\n* **OS**: Linux / macOS\n* **インストール必須コンポーネント**:\n  * Docker Engine / Docker Desktop (v20.10以上)\n  * Docker Compose (v2.0以上)\n  * Python (v3.11以上, ローカル検証用)\n  * Node.js (v18.0以上, ローカル検証用)\n\n### 1.2 環境起動手順"}, {"rel_path": "docs/operation_specs.md", "filename": "operation_specs.md", "category_id": "8_docs_and_others", "category_name": "ドキュメント & プロジェクト共通設定", "lines": 87, "summary": "HRConnect 運用仕様書", "details": {}, "preview": "# HRConnect 運用仕様書\n\n## 1. 監視・アラート設計 (Monitoring & Alerting)\n\n本システムはAWSサーバーレス構成を採用しているため、OSやサーバー自体の監視は不要ですが、APIの稼働状況やアプリケーションエラー、リソース制限に焦点を当てて監視を行います。\n\n### 1.1 ログ収集 (Log Collection)\n* **Amazon CloudWatch Logs**: \n  * AWS Lambdaの実行ログ（FastAPIのコンソール出力、未キャッチ例外スタックトレース）、API Gatewayのアクセスログを自動収集します。\n  * ログ保存期間: **90日間**（開発環境は14日間）。\n\n### 1.2 アラート通知の閾値と重要度 (Alert Thresholds & Severity)\n\n| 監視対象項目 | 監視方法 / ログソース | 閾値・検知条件 | アクション (連絡先) |\n| :--- | :--- | :--- | :--- |"}, {"rel_path": "docs/requirements_definition.md", "filename": "requirements_definition.md", "category_id": "8_docs_and_others", "category_name": "ドキュメント & プロジェクト共通設定", "lines": 114, "summary": "HRConnect 要件定義書", "details": {}, "preview": "# HRConnect 要件定義書\n\n## 1. はじめに (Introduction)\n\n### 1.1 システムの目的\n本システム「HRConnect」は、「勤怠管理」「シフト管理」「ワークフロー（諸届申請）」、および「工数管理（日報）」を単一のプラットフォームで統合管理するオールインワン労務管理システムです。\n複数の既存ツールをまたぐことによる転記作業や整合性の破綻を防ぎ、日本の複雑な就業規則や36協定に準拠したセキュアな業務基盤を提供します。\n\n### 1.2 解決したいビジネス課題\n1. **多重入力・転記ミスの削減**:\n   有給休暇の申請・承認が、勤怠実績（有給残日数）やシフト予定に自動で連動しないため、管理部門が手作業で転記する手間とミスが発生している。\n2. **プロジェクト収支の可視化**:\n   「従業員がどのプロジェクトのどの作業に何時間使ったか」という工数実績と、実際の労働時間（勤怠データ）が乖離しており、プロジェクト別の正確な労務コストが把握できない。\n3. **複雑な就業ルールの吸収**:\n   フレックスタイム制、変形労働時間制、各種休憩ルール、打刻丸め処理、36協定（残業上限）など、企業や雇用形態ごとに異なる日本の複雑な就業ルールに対応しきれていない。"}, {"rel_path": "frontend/.dockerignore", "filename": ".dockerignore", "category_id": "8_docs_and_others", "category_name" "code"], "doc": ""}, {"name": "get_python_explanation", "args": ["line", "line_num", "ast_map"], "doc": ""}, {"name": "analyze_python_ast", "args": ["code"], "doc": ""}, {"name": "get_ts_js_explanation", "args": ["line"], "doc": ""}, {"name": "infer_file_purpose", "args": ["file_path"], "doc": ""}, {"name": "generate_markdown_content", "args": ["file_path"], "doc": ""}, {"name": "main", "args": [], "doc": ""}], "imports": ["ast", "os", "pathlib", "re"]}, "preview": "\nimport os\nimport ast\nimport re\nfrom pathlib import Path\n\n# Config\nBASE_DIR = Path(\"/home/takunaga/HRConnect\")\nOUTPUT_DIR = BASE_DIR / \"md_file\"\nEXCLUDE_DIRS = {\n    \"node_modules\", \"venv\", \".venv\", \"__pycache__\", \".git\", \".next\", \n    \"dist\", \"build\", \"md_file\", \".idea\", \".vscode\", \"coverage\", \".pytest_cache\"\n}\nEXCLUDE_EXTENSIONS = {\n    \".pyc\", \".pyo\", \".pyd\", \".db\", \".sq3\", \".sqlite\", \".png\", \".jpg\", \".jpeg\", \".gif\", \".svg\", \".ico\", "}, {"rel_path": "scripts/restart_backend.sh", "filename": "restart_backend.sh", "category_id": "7_scripts_tests", "category_name": "運用スクリプト & 結合・単体テスト", "lines": 9, "summary": "!/bin/bash", "details": {}, "preview": "#!/bin/bash\n# バックエンドを全インターフェース(0.0.0.0)で待機するように再起動します。\n# これにより、localhost (IPv6/IPv4 の両方) からのアクセスを確実に受け取れるようになります。\n\necho \"Restarting backend with host 0.0.0.0...\"\npkill -f \"uvicorn app.main:app\"\ncd /home/takunaga/HRConnect/backend\nnohup ./venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload > uvicorn.log 2>&1 &\necho \"Backend restarted in background. Logging to backend/uvicorn.log\""}, {"rel_path": "system_specification_and_improvements.md", "filename": "system_specification_and_improvements.md", "category_id": "8_docs_and_others", "category_name": "ドキュメント & プロジェクト共通設定", "lines": 53, "summary": "HRConnect 実装改善ポイント（AIエージェント向け）", "details": {}, "preview": "# HRConnect 実装改善ポイント（AIエージェント向け）\n\n本ドキュメントは、HRConnectシステムにおける具体的な実装改善ポイントを分類して記載したものです。AIエージェントが直ちに取り組める改善アクションをまとめています。\n\n## 1. ロジックの一貫性と設定性\n\n### 1.1 サービス層におけるビジネスルールのハードコード\n*   **課題**: `side_effect.py` 内において、半日休暇の時間（09:00-12:00、13:00-18:00）がハードコードされています。\n*   **改善案**: これらの値を `WorkRule.config` またはグローバルな `SystemDefinition` に移行し、異なる会社のポリシーに対応できるようにします。\n*   **アクション**: `SideEffectService.apply_paid_leave_side_effects` をリファクタリングし、データベースからこれらの時間を取得するようにします。\n\n### 1.2 複数日にまたがる残業計算ロジック\n*   **課題**: `calculator.py` は深夜残業を単純に処理しています（「当日夜〜翌朝のみ」）。24時間を超えるシフトや複雑な夜勤シフトでは正しく動作しない可能性があります。\n*   **改善案**: 複数の日付をまたぐ遷移を処理できる、堅牢な時間区間の重複計算ロジックを実装します。\n*   **アクション**: `calculate_overtime` を拡張し、日別の境界リストを受け取れるようにします。"}, {"rel_path": "system_structure_and_specs.md", "filename": "system_structure_and_specs.md", "category_id": "8_docs_and_others", "category_name": "ドキュメント & プロジェクト共通設定", "lines": 488, "summary": "design.md", "details": {}, "preview": "# design.md\n\n---\n\n## 1. プロジェクト概要 (Overview)\n\n### 1.1 プロジェクト名\n    **HR-Connect (仮)**\n\n### 1.2 目的・解決したい課題\n*   **オールインワン労務管理:** 既存ツール（ジョブカン等）が持つ「勤怠管理」「シフト管理」「ワークフロー（諸届申請）」に加え、「工数管理（日報）」を単一のプラットフォームで統合管理する。\n*   **プロジェクト収支の可視化:** 従業員が「どのプロジェクトの・どの作業に・何時間使ったか」を記録し、案件ごとの人件費コストを正確に算出可能にする。\n*   **申請と勤怠の自動連動:** 休暇申請や残業申請が承認された際、自動的に勤怠データや有給残日数へ反映させ、手作業による転記ミスをゼロにする。\n*   **複雑な就業ルールの吸収:** フレックス、変形労働制、36協定（残業上限）チェックなど、日本の複雑な労務管理に対応する。これらルールは`work_rules.config`のJSONBスキーマ定義に基づき、柔軟に設定・管理される。\n*   **セキュアな基盤:** Amazon Cognitoを用いた堅牢な認証と、AWSサーバーレス構成によるスケーラビリティを確保する。"}, {"rel_path": "template.yaml", "filename": "template.yaml", "category_id": "1_infra_aws", "category_name": "インフラ & AWSサーバーレス構成", "lines": 181, "summary": "============================================================", "details": {}, "preview": "AWSTemplateFormatVersion: '2010-09-09'\nTransform: AWS::Serverless-2016-10-31\nDescription: >\n  HRConnect Fully Serverless Infrastructure\n  FastAPI on AWS Lambda, DynamoDB (Pay-Per-Request), Amazon S3, Amazon Cognito, and API Gateway HTTP API.\n  Idle Running Cost: $0/month.\n\nParameters:\n  Stage:\n    Type: String\n    Default: prod\n    Description: Deployment stage (dev, stg, prod)\n\nGlobals:\n  Function:"}];
    let currentCategory = "all";
    let selectedFilePath = filesData[0]?.rel_path || "";

    const fileListEl = document.getElementById("file-list");
    const searchBox = document.getElementById("search-box");
    const specViewEl = document.getElementById("spec-view");
    const tabs = document.querySelectorAll(".tab");

    function renderFileList() {
      const query = searchBox.value.toLowerCase();
      fileListEl.innerHTML = "";

      const filtered = filesData.filter(f => {
        const matchCat = (currentCategory === "all" || f.category_id === currentCategory);
        const matchQuery = f.rel_path.toLowerCase().includes(query) || f.summary.toLowerCase().includes(query);
        return matchCat && matchQuery;
      });

      filtered.forEach(f => {
        const item = document.createElement("div");
        item.className = "file-item" + (f.rel_path === selectedFilePath ? " active" : "");
        item.innerHTML = `
          <div class="file-item-name">${escapeHtml(f.rel_path)}</div>
          <div class="file-item-desc">${escapeHtml(f.summary)}</div>
        `;
        item.onclick = () => {
          selectedFilePath = f.rel_path;
          renderFileList();
          renderDetail(f);
        };
        fileListEl.appendChild(item);
      });

      if (filtered.length > 0 && !filtered.some(f => f.rel_path === selectedFilePath)) {
        selectedFilePath = filtered[0].rel_path;
        renderDetail(filtered[0]);
      }
    }

    function renderDetail(file) {
      if (!file) {
        specViewEl.innerHTML = "<p>ファイルが選択されていません。</p>";
        return;
      }

      let classesHtml = "";
      if (file.details.classes && file.details.classes.length > 0) {
        classesHtml = `
          <div class="spec-card">
            <h3>🏛️ 定義クラス (${file.details.classes.length})</h3>
            <table class="detail-table">
              <tr><th>クラス名</th><th>メソッド一覧</th><th>Docstring / 役割</th></tr>
              ${file.details.classes.map(c => `
                <tr>
                  <td><code>${escapeHtml(c.name)}</code></td>
                  <td>${c.methods.map(m => `<code>${escapeHtml(m)}()</code>`).join(", ") || "なし"}</td>
                  <td>${escapeHtml(c.doc || "説明なし")}</td>
                </tr>
              `).join("")}
            </table>
          </div>
        `;
      }

      let funcsHtml = "";
      if (file.details.functions && file.details.functions.length > 0) {
        funcsHtml = `
          <div class="spec-card">
            <h3>⚡ 定義関数 / エンドポイント (${file.details.functions.length})</h3>
            <table class="detail-table">
              <tr><th>関数名</th><th>引数</th><th>Docstring / 概要</th></tr>
              ${file.details.functions.map(fn => `
                <tr>
                  <td><code>${escapeHtml(fn.name)}</code></td>
                  <td><code>${escapeHtml(fn.args.join(", "))}</code></td>
                  <td>${escapeHtml(fn.doc || "なし")}</td>
                </tr>
              `).join("")}
            </table>
          </div>
        `;
      }

      let tsCompsHtml = "";
      if (file.details.components_or_funcs && file.details.components_or_funcs.length > 0) {
        tsCompsHtml = `
          <div class="spec-card">
            <h3>⚛️ コンポーネント / 関数 (${file.details.components_or_funcs.length})</h3>
            <div>${file.details.components_or_funcs.map(cf => `<span class="tag">${escapeHtml(cf)}</span>`).join("")}</div>
          </div>
        `;
      }

      let tsInterfacesHtml = "";
      if (file.details.interfaces && file.details.interfaces.length > 0) {
        tsInterfacesHtml = `
          <div class="spec-card">
            <h3>📋 インターフェース / 型定義 (${file.details.interfaces.length})</h3>
            <div>${file.details.interfaces.map(inf => `<span class="tag">${escapeHtml(inf)}</span>`).join("")}</div>
          </div>
        `;
      }

      let importsHtml = "";
      if (file.details.imports && file.details.imports.length > 0) {
        importsHtml = `
          <div class="spec-card">
            <h3>🔗 主な依存関係 (Imports)</h3>
            <div>${file.details.imports.map(imp => `<span class="tag">${escapeHtml(imp)}</span>`).join("")}</div>
          </div>
        `;
      }

      specViewEl.innerHTML = `
        <div class="spec-header">
          <div class="spec-title">${escapeHtml(file.rel_path)}</div>
          <div>
            <span class="spec-badge">${escapeHtml(file.category_name)}</span>
            <span class="spec-badge" style="background:#f1f5f9; color:#475569;">${file.lines} 行</span>
          </div>
          <div class="spec-summary">${escapeHtml(file.summary)}</div>
        </div>

        ${classesHtml}
        ${funcsHtml}
        ${tsCompsHtml}
        ${tsInterfacesHtml}
        ${importsHtml}

        <div class="spec-card">
          <h3>📄 コードプレビュー (先頭部)</h3>
          <pre class="code-preview"><code>${escapeHtml(file.preview)}</code></pre>
        </div>
      `;
    }

    function escapeHtml(str) {
      if (!str) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    // Tab Events
    tabs.forEach(tab => {
      tab.onclick = () => {
        tabs.forEach(t => t.classList.remove("active"));
        tab.classList.add("active");
        currentCategory = tab.dataset.cat;
        renderFileList();
      };
    });

    searchBox.oninput = () => renderFileList();

    // Initial render
    renderFileList();
    renderDetail(filesData[0]);
  </script>
