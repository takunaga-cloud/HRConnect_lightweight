<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E3A8A;stop-opacity:1" />
    </linearGradient>
  </defs>
  <circle cx="50" cy="50" r="45" fill="url(#grad)" />
  <!-- つながり（Connect）を表現するノードとラインの構成 -->
  <line x1="35" y1="35" x2="50" y2="65" stroke="#ffffff" stroke-width="5" stroke-linecap="round" />
  <line x1="65" y1="35" x2="50" y2="65" stroke="#ffffff" stroke-width="5" stroke-linecap="round" />
  <line x1="35" y1="35" x2="65" y2="35" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-dasharray="2,3" />
  <circle cx="35" cy="35" r="8" fill="#ffffff" />
  <circle cx="65" cy="35" r="8" fill="#ffffff" />
  <circle cx="50" cy="65" r="10" fill="#ffffff" />
</svg>
